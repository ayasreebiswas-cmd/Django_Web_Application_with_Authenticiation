{% extends 'tasks/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow border border-slate-200">
    <h2 class="text-2xl font-bold mb-6 text-slate-800">Assign New Task</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded transition">Create Task</button>
    </form>
</div>
{% endblock %}
