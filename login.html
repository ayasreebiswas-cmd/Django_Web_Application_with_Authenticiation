{% extends 'tasks/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow border border-slate-200">
    <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">Account Login</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition">Login</button>
    </form>
    <div class="mt-4 text-center text-sm">
        <a href="{% url 'password_reset' %}" class="text-blue-600 hover:underline">Forgot password?</a> | 
        <a href="{% url 'register' %}" class="text-blue-600 hover:underline">Register</a>
    </div>
</div>
{% endblock %}
